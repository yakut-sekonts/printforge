[pytest]
markers =
    unit: быстрые unit-проверки без worker и сети
    contract: проверка схем, IPC и реестров
    integration: интеграция нескольких production-компонентов
    real_kernel: проверка с настоящим build123d/OCP worker
    ai: deterministic AI pipeline без внешней LLM
    help: справочник и обучение
    release: сборочные и release-контракты
